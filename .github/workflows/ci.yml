name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test tests/sim.test.mjs tests/internet.test.mjs
      - run: node tests/metrics.mjs
      - run: node tests/heldout.mjs
      - run: grep -R "plagiarized" src index.html limitations.html && exit 1 || true
